name: Daily news
# Runs twice a day and on demand. Free for public repositories.
on:
  schedule:
    - cron: "20 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and summarise official news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node tools/autonews.js
      - name: Commit changes
        run: |
          git config user.name "viceverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-auto.json state/seen.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
      - name: Open review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f review-queue.md ]; then gh issue create --title "Headlines to review ($(date +%F))" --body-file review-queue.md; fi
